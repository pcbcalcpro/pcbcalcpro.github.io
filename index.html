    currentLang = lang;

    document.getElementById('title').textContent = t.title;
    document.getElementById('lab_current').textContent = t.lab_current;
    document.getElementById('lab_temp').textContent = t.lab_temp;
    document.getElementById('lab_cu').textContent = t.lab_cu;
    document.getElementById('lab_len').textContent = t.lab_len;
    document.getElementById('calcBtn').textContent = t.calcBtn;
    document.getElementById('darkBtn').textContent = darkMode ? t.light : t.dark;
    document.getElementById('copyLabel').textContent = t.copyBtn;

    // 保留计算结果
    var wmmVal  = document.getElementById('wmm').textContent;
    var wmilVal = document.getElementById('wmil').textContent;
    var resVal  = document.getElementById('res').textContent;
    var vdropVal= document.getElementById('vdrop').textContent;

    document.getElementById('out_wmm').innerHTML  = t.out_wmm  + ' <span id="wmm">'  + wmmVal  + '</span>';
    document.getElementById('out_wmil').innerHTML = t.out_wmil + ' <span id="wmil">' + wmilVal + '</span>';
    document.getElementById('out_res').innerHTML  = t.out_res  + ' <span id="res">'  + resVal  + '</span>';
    document.getElementById('out_vdrop').innerHTML= t.out_vdrop+ ' <span id="vdrop">'+ vdropVal+ '</span>';

    document.getElementById('langSelect').value = lang;
}

// ============ 从 localStorage 读取用户偏好 ============
function loadUserPrefs() {
    try {
        var savedLang = localStorage.getItem('pcbcalc_lang');
        var savedDark = localStorage.getItem('pcbcalc_dark');

        if (savedLang && texts[savedLang]) {
            // 用户之前手动选过语言 → 直接用存储的，跳过 IP 检测
            applyLang(savedLang);
            userPickedLang = true;
        }

        if (savedDark === 'true') {
            darkMode = true;
            document.body.classList.add('dark');
            document.getElementById('darkBtn').textContent = texts[currentLang].light;
        }
    } catch(e) {
        // localStorage 不可用（无痕模式等），静默忽略
    }
}

// ============ IP 地区检测 → 自动切换语言 ============
function detectLanguageFromIP() {
    fetch('https://ipapi.co/country_code/', { signal: AbortSignal.timeout(3000) })
        .then(function(res) { return res.text(); })
        .then(function(countryCode) {
            countryCode = countryCode.trim().toUpperCase();
            var detectedLang = countryToLang[countryCode] || "en";

            // 仅当用户从未手动选过语言时才自动切换
            if (!userPickedLang) {
                applyLang(detectedLang);
            }
        })
        .catch(function() {
            // 检测失败 → 保持当前语言（可能是 localStorage 恢复的）
            if (!userPickedLang) {
                applyLang("en");
            }
        });
}

// ============ 深色模式（记住偏好） ============
document.getElementById('darkBtn').addEventListener('click', function() {
    darkMode = !darkMode;
    document.body.classList.toggle('dark', darkMode);
    this.textContent = darkMode ? texts[currentLang].light : texts[currentLang].dark;
    try { localStorage.setItem('pcbcalc_dark', darkMode ? 'true' : 'false'); } catch(e) {}
});

// ============ 手动语言切换（记住偏好） ============
document.getElementById('langSelect').addEventListener('change', function(e) {
    var lang = e.target.value;
    userPickedLang = true;
    applyLang(lang);
    // 保存到浏览器，下次打开直接用
    try { localStorage.setItem('pcbcalc_lang', lang); } catch(e) {}
});

// ============ 复制按钮 ============
document.getElementById('copyBtn').addEventListener('click', function() {
    var t = texts[currentLang];

    // 检查是否已计算
    if (lastCalc.wmm === null) {
        showToast(t.copyWarn);
        return;
    }

    // 构建 Tab 分隔文本（粘贴到 Excel 自动分列）
    var lines = [
        t.copyHeader,
        '',
        t.copyInputs,
        t.copyCurrent  + '\t' + lastCalc.I.toFixed(2),
        t.copyTemp     + '\t' + lastCalc.T.toFixed(0),
        t.copyCu       + '\t' + lastCalc.cu.toFixed(1),
        t.copyLen      + '\t' + lastCalc.L.toFixed(0),
        '',
        t.copyResults,
        t.copyWmm      + '\t' + lastCalc.wmm.toFixed(2),
        t.copyWmil     + '\t' + lastCalc.wmil.toFixed(2),
        t.copyRes      + '\t' + lastCalc.res.toFixed(2),
        t.copyVdrop    + '\t' + lastCalc.vdrop.toFixed(2)
    ];

    var clipboardText = lines.join('\n');

    // Clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(clipboardText).then(function() {
            showCopied();
        }).catch(function() {
            fallbackCopy(clipboardText);
        });
    } else {
        fallbackCopy(clipboardText);
    }
});

function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        document.execCommand('copy');
        showCopied();
    } catch(e) {
        alert('Copy failed. Please select and copy manually.');
    }
    document.body.removeChild(ta);
}

function showCopied() {
    var btn = document.getElementById('copyBtn');
    var label = document.getElementById('copyLabel');
    var origText = label.textContent;
    var t = texts[currentLang];

    btn.classList.add('copied');
    label.textContent = t.copied;

    setTimeout(function() {
        btn.classList.remove('copied');
        label.textContent = t.copyBtn;  // 恢复当前语言的按钮文字
    }, 2000);
}

// ============ Toast 提示（页面底部滑入，不弹窗） ============
function showToast(msg) {
    var toast = document.getElementById('toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(30,30,30,0.92);color:#fff;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:500;z-index:9999;opacity:0;transition:all 0.35s ease;box-shadow:0 8px 24px rgba(0,0,0,0.3);white-space:nowrap;pointer-events:none;';
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    // 触发进入动画
    requestAnimationFrame(function() {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    // 2秒后自动消失
    if (toast._timer) clearTimeout(toast._timer);
    toast._timer = setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(60px)';
    }, 2500);
}

// ============ 计算按钮 ============
document.getElementById('calcBtn').addEventListener('click', function() {
    try {
        var I = parseFloat(document.getElementById('current').value);
        var T = parseFloat(document.getElementById('temp').value);
        var cu= parseFloat(document.getElementById('cu').value);
        var L = parseFloat(document.getElementById('len').value);

        if (isNaN(I) || isNaN(T) || isNaN(cu) || isNaN(L) || I <= 0) {
            alert(texts[currentLang].error);
            return;
        }

        /* === IPC-2221 标准公式（外层） ===
         * wMil = (I / (0.048 * dT^0.44 * cuMil^0.725))^(1/0.725)
         */
        var cuMil = cu * 1.378;
        var base  = 0.048 * Math.pow(T, 0.44) * Math.pow(cuMil, 0.725);
        var wMil  = Math.pow(I / base, 1 / 0.725);
        var wMm   = wMil / 39.37;

        /* === 电阻 & 压降 ===
         * R = ρ * L / A   ;  ρ(copper) = 1.72e-8 Ω·m
         * A = w(m) * thickness(m)   ;  1oz = 0.035mm = 3.5e-5 m
         */
        var rho       = 1.72e-8;
        var cuMeter   = cu * 0.000035;
        var crossArea = (wMm / 1000) * cuMeter;
        var resistance= rho * (L / 1000) / crossArea;
        var vDrop     = I * resistance;

        var wMmRounded   = parseFloat(wMm.toFixed(2));
        var wMilRounded  = parseFloat(wMil.toFixed(2));
        var resRounded   = parseFloat((resistance * 1000).toFixed(2));
        var vdropRounded = parseFloat((vDrop * 1000).toFixed(2));

        // 渲染
        document.getElementById('wmm').textContent   = wMmRounded;
        document.getElementById('wmil').textContent   = wMilRounded;
        document.getElementById('res').textContent    = resRounded;
        document.getElementById('vdrop').textContent  = vdropRounded;

        // 存到 lastCalc（给复制按钮用）
        lastCalc = {
            wmm: wMmRounded, wmil: wMilRounded,
            res: resRounded, vdrop: vdropRounded,
            I: I, T: T, cu: cu, L: L
        };

        // 恢复复制按钮状态（如果之前显示"已复制"）
        var btn = document.getElementById('copyBtn');
        if (btn.classList.contains('copied')) {
            btn.classList.remove('copied');
            document.getElementById('copyLabel').textContent = texts[currentLang].copyBtn;
        }

    } catch(err) {
        alert('Error: ' + err.message);
    }
});

// ============ 页面初始化 ============
loadUserPrefs();     // 先读 localStorage（用户之前的语言/深色选择）
if (!userPickedLang) {
    // 用户没选过 → 先显示英文，再 IP 检测
    applyLang("en");
    detectLanguageFromIP();
}
</script>
